# Hand-copy reverse proxy for the media-player-oss backend API only; NOT used by deploy/install.sh.
# Proxies /api/ and /healthz to the backend on 127.0.0.1:8767; the Web UI is not served here.
# Must run on the same host (uvicorn trusts X-Forwarded-* from 127.0.0.1 only) and keep /api/ at the
# site root. Add the host name to ALLOWED_HOSTS in backend/.env (no port); a client served from another
# origin also needs that origin in ALLOWED_ORIGINS. Then: nginx -t && systemctl reload nginx

# ---- Part 1: http { } level (e.g. /etc/nginx/conf.d/media-player-oss-http.conf); define once ----

# /api/stream carries the JWT as ?token= (audio elements cannot send headers),
# so access logs record $uri only, never the query string.
log_format media_player_oss '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                            '$status $body_bytes_sent $request_time "$http_user_agent"';

# Per-client login throttle on top of the backend's global 5-failures/5-minutes limit.
limit_req_zone $binary_remote_addr zone=media_player_login:10m rate=10r/m;

# ---- Part 2: server { } block; replace music.example.com, or paste only the location blocks ----
# Each location repeats the proxy headers so it still works when pasted into an existing server.
# $http_host keeps a non-default port so the backend's same-origin check matches the browser Origin.

server {
    listen 80;
    listen [::]:80;
    server_name music.example.com;

    server_tokens off;
    access_log /var/log/nginx/media-player-oss.access.log media_player_oss;
    error_log /var/log/nginx/media-player-oss.error.log warn;
    client_max_body_size 16k;

    location = /healthz {
        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
    }

    location = /api/auth/login {
        limit_req zone=media_player_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
    }

    # Byte-range audio streaming: no buffering, long reads, token-bearing URLs kept out of error logs.
    location = /api/stream {
        error_log /var/log/nginx/media-player-oss.error.log crit;
        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Rest of the API: /api/auth/status, /api/config, /api/tracks, /api/tracks/meta.
    location /api/ {
        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
    }

    # Backend only: nothing else is served on this host name.
    location / {
        return 404;
    }
}
