# Installed by deploy/install.sh to /etc/nginx/sites-available/media-player-oss.
# __SERVER_NAME__ is replaced with SERVER_NAME (default: ECS public IP).
# The stock "default" site is left untouched; this server wins by exact server_name.

# /api/stream carries the JWT as ?token= (audio elements cannot send headers),
# so access logs record $uri only, never the query string.
log_format media_player_oss '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                            '$status $body_bytes_sent $request_time "$http_user_agent"';

# Per-client login throttle on top of the backend's global 5-failures/5-minutes limit.
limit_req_zone $binary_remote_addr zone=media_player_login:10m rate=10r/m;

upstream media_player_backend {
    server 127.0.0.1:8767;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    root /var/www/media-player-oss;
    server_tokens off;
    access_log /var/log/nginx/media-player-oss.access.log media_player_oss;
    error_log /var/log/nginx/media-player-oss.error.log warn;
    client_max_body_size 16k;

    # Same headers the backend sets on its own responses.
    set $mpo_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; media-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'";

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy $mpo_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy $mpo_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Hashed Vite bundles: cache forever, never fall back to index.html.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /healthz {
        proxy_pass http://media_player_backend;
        include /etc/nginx/snippets/media-player-oss-proxy.conf;
    }

    location = /api/auth/login {
        limit_req zone=media_player_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://media_player_backend;
        include /etc/nginx/snippets/media-player-oss-proxy.conf;
    }

    # Byte-range audio streaming: no buffering, long reads, token-bearing URLs kept out of error logs.
    location = /api/stream {
        error_log /var/log/nginx/media-player-oss.error.log crit;
        proxy_pass http://media_player_backend;
        include /etc/nginx/snippets/media-player-oss-proxy.conf;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/ {
        proxy_pass http://media_player_backend;
        include /etc/nginx/snippets/media-player-oss-proxy.conf;
    }

    location / {
        return 404;
    }
}
