# Install as /etc/nginx/conf.d/media-player-oss.conf, included inside http {}.
# Install the header snippet separately under /etc/nginx/snippets/, not conf.d/.
# Replace music.example.com in BOTH maps/servers and certificate paths.
map $status $media_player_asset_cache {
    default "no-store";
    200 "public, max-age=31536000, immutable";
    206 "public, max-age=31536000, immutable";
    304 "public, max-age=31536000, immutable";
}

# Check the actual Host, not $host (which can fall back to server_name).
map $http_host $media_player_host_allowed {
    default 0;
    "~*^music[.]example[.]com(:[0-9]+)?$" 1;
}

# Coordinate these default listeners with existing sites; never use the app as
# the default site. Unknown SNI is rejected before any certificate is served.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name music.example.com;
    if ($media_player_host_allowed = 0) { return 444; }
    return 308 https://music.example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name music.example.com;
    ssl_certificate /etc/nginx/tls/music.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/music.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Also reject missing/unknown HTTP Hosts after a valid SNI handshake.
    if ($media_player_host_allowed = 0) { return 444; }

    root /opt/media-player-oss/frontend/dist;
    server_tokens off;
    autoindex off;
    # Check every path component, including dist and its parents.
    disable_symlinks on;
    expires off;
    gzip off;
    send_timeout 60s;

    # All proxy locations inherit this COMPLETE set. Do not add a lone
    # proxy_set_header in a child location: that would discard this set.
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_cache off;
    proxy_intercept_errors off;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # No URI suffix or rewrite: keep /api and the original encoded query.
    # OPTIONS, Range responses, backend CSP and CORS all pass through Python.
    location = /api {
        proxy_pass http://127.0.0.1:8767;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8767;
    }
    location = /api/stream {
        proxy_read_timeout 300s;
        proxy_pass http://127.0.0.1:8767;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:8767;
    }

    location = / {
        include /etc/nginx/snippets/media-player-oss-static.conf;
        add_header Cache-Control "no-store" always;
        try_files /index.html @frontend_unavailable;
    }
    location = /index.html {
        include /etc/nginx/snippets/media-player-oss-static.conf;
        add_header Cache-Control "no-store" always;
        try_files /index.html @frontend_unavailable;
    }
    location @frontend_unavailable {
        include /etc/nginx/snippets/media-player-oss-static.conf;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 503 "Frontend build unavailable. Build or upload frontend/dist including index.html.\n";
    }

    location ~ (^|/)\. {
        include /etc/nginx/snippets/media-player-oss-static.conf;
        add_header Cache-Control "no-store" always;
        return 404;
    }
    # Only flat, content-hashed build assets; no subdirectories or arbitrary files.
    location ~ "^/assets/[A-Za-z0-9_-]+-[A-Za-z0-9_-]{8,}\.[A-Za-z0-9]+$" {
        include /etc/nginx/snippets/media-player-oss-static.conf;
        add_header Cache-Control $media_player_asset_cache always;
        try_files $uri =404;
    }
    # Includes /static, project/config/data paths and all non-build resources.
    # There is deliberately no global SPA fallback.
    location / {
        include /etc/nginx/snippets/media-player-oss-static.conf;
        add_header Cache-Control "no-store" always;
        return 404;
    }
}
