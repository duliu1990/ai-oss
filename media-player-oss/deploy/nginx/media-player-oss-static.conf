# Install as /etc/nginx/snippets/media-player-oss-static.conf.
# Include only in static locations, never in http {} or API proxy locations.
# Repeat the full include wherever add_header Cache-Control is set: Nginx
# before 1.29.3 does not merge parent and child add_header directives.
# Keep this policy aligned with app.py security_headers.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; media-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
