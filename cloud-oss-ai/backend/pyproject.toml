[project]
name = "cloud-oss-ai"
version = "0.1.0"
description = "Personal drive, Markdown notes and music player backed by one private Aliyun OSS bucket"
requires-python = ">=3.12,<3.13"
dependencies = [
  "bcrypt>=4,<6",
  "fastapi>=0.115,<1",
  "oss2>=2.19,<3",
  "PyJWT>=2.9,<3",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "python-multipart>=0.0.20,<1",
  "truststore>=0.10,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
