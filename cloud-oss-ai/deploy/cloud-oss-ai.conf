# AI-Modified: Qoder Agent 2026-11-23 - Add frontend static serving and caching.
# Standalone nginx site for the cloud-oss-ai Web UI and backend API.
# Serves frontend/dist from /var/www/cloud-oss-ai; proxies /api/ and /healthz to
# the backend on 127.0.0.1:8790 (PORT in backend/.env).
# Must run on the same host: the backend binds 127.0.0.1 and trusts X-Forwarded-* from 127.0.0.1 only.
# Keep /api/ at the site root. Add the public host name to ALLOWED_HOSTS in backend/.env, and any
# browser client served from another origin to ALLOWED_ORIGINS, then restart the backend.
#
# Every directive below is http-level, so this single file goes inside the http { } block of
# /etc/nginx/nginx.conf. The stock nginx.conf already includes conf.d there:
#   http { ... include /etc/nginx/conf.d/*.conf; ... }
# Install from the cloud-oss-ai project directory (requires a frontend build):
#   npm --prefix frontend ci && npm --prefix frontend run build
#   sudo mkdir -p /var/www/cloud-oss-ai
#   sudo cp -a frontend/dist/. /var/www/cloud-oss-ai/
# Change root below if you deploy elsewhere; nginx needs read/traverse permission on that path.
# Keep the standard http-level mime.types include so JavaScript and CSS have correct MIME types.
# server_name is the server's public IP; change it if the host or a domain changes.
#   sudo cp deploy/cloud-oss-ai.conf /etc/nginx/conf.d/cloud-oss-ai.conf
#   sudo nginx -t && sudo systemctl reload nginx
# Never include it outside http { } (e.g. at the top level of nginx.conf); nginx -t would reject it.

# Download, preview and audio stream URLs carry the JWT as ?token= (iframes and media elements
# cannot send headers), so access logs record $uri only, never the query string.
log_format cloud_oss_ai '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent $request_time "$http_user_agent"';

# Per-client login throttle on top of the backend's global 5-failures/5-minutes limit.
limit_req_zone $binary_remote_addr zone=cloud_oss_ai_login:10m rate=10r/m;

# Each location repeats the proxy headers so it still works when pasted into an existing server.
# $http_host keeps a non-default port so the backend's same-origin check matches the browser Origin.

server {
    listen 80;
    listen [::]:80;
    server_name 8.137.103.155;

    root /var/www/cloud-oss-ai;
    index index.html;

    server_tokens off;
    access_log /var/log/nginx/cloud-oss-ai.access.log cloud_oss_ai;
    error_log /var/log/nginx/cloud-oss-ai.error.log warn;
    # Text create/edit JSON bodies are capped at 7 MiB by the backend; a 1 MiB note escapes to at most 6 MiB.
    client_max_body_size 8m;

    location = /healthz {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
    }

    location = /api/auth/login {
        limit_req zone=cloud_oss_ai_login burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
    }

    # Range-streamed downloads and previews: no buffering, long reads, token-bearing URLs kept out of error logs.
    location = /api/files/download {
        error_log /var/log/nginx/cloud-oss-ai.error.log crit;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Byte-range audio streaming: same treatment as downloads.
    location = /api/stream {
        error_log /var/log/nginx/cloud-oss-ai.error.log crit;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Direct uploads (< 5 MiB) and 5 MiB multipart parts are streamed straight to the backend.
    location ^~ /api/files/upload {
        client_max_body_size 6m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Rest of the API: /api/auth/status, /api/config, /api/files (list, search, edit, folder,
    # rename, move), /api/notes, /api/tracks, /api/tracks/meta.
    location /api/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # Recursive folder delete, move and rename copy object by object.
        proxy_read_timeout 300s;
    }

    # Do not let a bare API path fall through to the SPA.
    location = /api {
        return 404;
    }

    # HTML must be reloaded after deployment so it references the current hashed bundles.
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Office preview is a separate Vite entry point, not the main SPA.
    location = /preview.html {
        # Preview links may contain a token; keep their query strings out of error logs too.
        error_log /var/log/nginx/cloud-oss-ai.error.log crit;
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Vite fingerprints assets. Missing bundles must return 404, never index.html.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Main app (hash routes), Markdown previews and optional SPA deep links.
    location / {
        error_log /var/log/nginx/cloud-oss-ai.error.log crit;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
