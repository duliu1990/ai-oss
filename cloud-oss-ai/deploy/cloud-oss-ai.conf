# Standalone nginx site for the cloud-oss-ai backend API only; the Web UI is not served here.
# Proxies /api/ and /healthz to the backend on 127.0.0.1:8790 (PORT in backend/.env).
# Must run on the same host: the backend binds 127.0.0.1 and trusts X-Forwarded-* from 127.0.0.1 only.
# Keep /api/ at the site root. Add the public host name to ALLOWED_HOSTS in backend/.env, and any
# browser client served from another origin to ALLOWED_ORIGINS, then restart the backend.
#
# Every directive below is http-level, so this single file goes inside the http { } block of
# /etc/nginx/nginx.conf. The stock nginx.conf already includes conf.d there:
#   http { ... include /etc/nginx/conf.d/*.conf; ... }
# Install (server_name is the server's public IP; change it if the host or a domain changes):
#   sudo cp deploy/cloud-oss-ai.conf /etc/nginx/conf.d/cloud-oss-ai.conf
#   sudo nginx -t && sudo systemctl reload nginx
# Never include it outside http { } (e.g. at the top level of nginx.conf); nginx -t would reject it.

# Download, preview and audio stream URLs carry the JWT as ?token= (iframes and media elements
# cannot send headers), so access logs record $uri only, never the query string.
log_format cloud_oss_ai '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent $request_time "$http_user_agent"';

# Per-client login throttle on top of the backend's global 5-failures/5-minutes limit.
limit_req_zone $binary_remote_addr zone=cloud_oss_ai_login:10m rate=10r/m;

# Each location repeats the proxy headers so it still works when pasted into an existing server.
# $http_host keeps a non-default port so the backend's same-origin check matches the browser Origin.

server {
    listen 80;
    listen [::]:80;
    server_name 8.137.103.155;

    server_tokens off;
    access_log /var/log/nginx/cloud-oss-ai.access.log cloud_oss_ai;
    error_log /var/log/nginx/cloud-oss-ai.error.log warn;
    # Text create/edit JSON bodies are capped at 7 MiB by the backend; a 1 MiB note escapes to at most 6 MiB.
    client_max_body_size 8m;

    location = /healthz {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
    }

    location = /api/auth/login {
        limit_req zone=cloud_oss_ai_login burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
    }

    # Range-streamed downloads and previews: no buffering, long reads, token-bearing URLs kept out of error logs.
    location = /api/files/download {
        error_log /var/log/nginx/cloud-oss-ai.error.log crit;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Byte-range audio streaming: same treatment as downloads.
    location = /api/stream {
        error_log /var/log/nginx/cloud-oss-ai.error.log crit;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Direct uploads (< 5 MiB) and 5 MiB multipart parts are streamed straight to the backend.
    location ^~ /api/files/upload {
        client_max_body_size 6m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Rest of the API: /api/auth/status, /api/config, /api/files (list, search, edit, folder,
    # rename, move), /api/notes, /api/tracks, /api/tracks/meta.
    location /api/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # Recursive folder delete, move and rename copy object by object.
        proxy_read_timeout 300s;
    }

    # Backend only: nothing else is served on this host name.
    location / {
        return 404;
    }
}
